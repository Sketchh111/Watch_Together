<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Watch Together</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <!-- LOGO -->
        <div class="auth-logo">
            <div class="logo-icon">🎬</div>

            <h1>Watch Together</h1>

            <p>
                Watch. Chat. Enjoy together.
            </p>
        </div>


        <!-- LOGIN CARD -->
        <div class="auth-card" id="loginCard">

            <h2>Welcome Back 👋</h2>

            <p class="auth-subtitle">
                Login to continue watching with your friends.
            </p>


            <!-- USERNAME -->
            <div class="auth-input-group">

                <label for="loginUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter your username"
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->
            <div class="auth-input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN BUTTON -->
            <button
                class="auth-button"
                onclick="loginUser()">

                Login

            </button>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <!-- REGISTER -->
            <p class="switch-auth">

                Don't have an account?

                <button
                    type="button"
                    onclick="showRegister()">

                    Create account

                </button>

            </p>

        </div>


        <!-- REGISTER CARD -->
        <div class="auth-card hidden"
             id="registerCard">

            <h2>Create Account 🚀</h2>

            <p class="auth-subtitle">
                Create your Watch Together account.
            </p>


            <!-- USERNAME -->
            <div class="auth-input-group">

                <label for="registerUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Choose a username"
                >

            </div>


            <!-- EMAIL -->
            <div class="auth-input-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                >

            </div>


            <!-- PASSWORD -->
            <div class="auth-input-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="auth-input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

            </div>


            <!-- REGISTER BUTTON -->
            <button
                class="auth-button"
                onclick="registerUser()">

                Create Account

            </button>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <!-- LOGIN -->
            <p class="switch-auth">

                Already have an account?

                <button
                    type="button"
                    onclick="showLogin()">

                    Login

                </button>

            </p>

        </div>


        <!-- FOOTER -->

        <p class="auth-footer">
            © 2026 Watch Together
        </p>

    </div>


    <script src="app.js"></script>

</body>

</html>
